name: Deploy a producción (VPS)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy por SSH y reconstruir el contenedor
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.VPS_PROJECT_PATH }}"
            echo "=== git pull ==="
            git pull origin main
            echo "=== docker compose build + up (nextjs) ==="
            docker compose up -d --build nextjs
            echo "=== estado de los contenedores ==="
            docker compose ps
            echo "=== últimas líneas del log de nextjs ==="
            docker compose logs --tail=60 nextjs
